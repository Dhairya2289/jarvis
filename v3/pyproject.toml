[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-v3"
version = "0.1.0"
description = "JARVIS V3 — Async-first personal AI OS with multi-model routing, workflows, and vision"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "JARVIS V3 Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ── Core AI & API ─────────────────────
    "anthropic>=0.40.0",
    "openai>=1.30",
    "httpx>=0.27",
    "requests>=2.31",

    # ── CLI & UI ──────────────────────────
    "click>=8",
    "rich>=13.7",
    "prompt_toolkit>=3.0",

    # ── Web / Server ──────────────────────
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "websockets>=15.0.1",
    "flask>=3.0",

    # ── Web Scraping ──────────────────────
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.9",
    "feedparser>=6.0",
    "playwright>=1.44",
    "ddgs>=9.11.4",

    # ── Memory / Vector ───────────────────
    "chromadb>=0.5",
    "networkx>=3.3",
    "numpy>=1.26",

    # ── Voice ─────────────────────────────
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "piper-tts>=1.2.0",

    # ── Config / Utils ────────────────────
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "tomlkit>=0.12",
    "psutil>=5.9",

    # ── Messaging ─────────────────────────
    "python-telegram-bot>=21.0",

    # ── V3 New: Workflows ─────────────────
    "schedule>=1.2",
    "croniter>=2.0",
    "pyyaml>=6.0",

    # ── V3 New: Screen / Vision ───────────
    "mss>=9.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "respx>=0.22",
]

[project.scripts]
jarvis-v3 = "jarvis_v3.cli:main"

[project.urls]
Homepage = "https://github.com/jarvis-v3/jarvis"
Repository = "https://github.com/jarvis-v3/jarvis"
Issues = "https://github.com/jarvis-v3/jarvis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_v3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: requires real API keys",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
