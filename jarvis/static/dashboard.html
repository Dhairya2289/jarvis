<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS Dashboard</title>
<style>
:root{--bg:#020c18;--card-bg:rgba(10,22,40,0.95);--border:rgba(0,212,255,0.12);--accent:#00d4ff;--text:#e8f4f8;--muted:#8a9bb3;--green:#00e676;--yellow:#ffab00;--red:#ff5252;--font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at center,#0a1630 0%,var(--bg) 100%);color:var(--text);font-family:var(--font);min-height:100vh}
.topbar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;background:rgba(2,12,24,0.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:10}
.topbar h1{font-size:1rem;color:var(--accent);letter-spacing:0.08em}
.status{display:flex;gap:1.5rem;font-size:0.8rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:0.3rem}
.dot.ok{background:var(--green)}.dot.warn{background:var(--yellow)}.dot.err{background:var(--red)}
main{padding:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:transform .2s}
.panel:hover{transform:translateY(-2px)}.panel.err{border-color:var(--red)}
.panel header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;color:var(--accent);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em}
.panel header svg{width:16px;height:16px}
.content{font-size:0.85rem;min-height:60px}
.error{color:var(--red);font-size:0.8rem;margin-top:0.5rem;display:none}
.panel.err .error{display:block}
.bar{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;margin:0.4rem 0}
.bar>div{height:100%;border-radius:4px;transition:width .4s}
.lo{background:var(--green)}.md{background:var(--yellow)}.hi{background:var(--red)}
.rw{display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:0.2rem}
.item-list{display:flex;flex-direction:column;gap:0.4rem;max-height:180px;overflow-y:auto}
.it{padding:0.4rem 0.5rem;background:rgba(255,255,255,0.03);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.8rem}
.it:hover{background:rgba(0,212,255,0.05)}
.chat-messages{height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.75rem;padding-right:0.25rem}
.msg{padding:0.6rem 0.8rem;border-radius:10px;max-width:90%;font-size:0.85rem;line-height:1.4}
.msg.u{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.15);align-self:flex-end;border-bottom-right-radius:2px}
.msg.j{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.15);align-self:flex-start;border-bottom-left-radius:2px}
.chat-input{display:flex;gap:0.5rem}
input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:0.6rem;color:var(--text);font-family:inherit;flex:1;outline:none}
input:focus{border-color:var(--accent)}input:disabled{opacity:0.5}
button{background:var(--accent);color:#000;border:none;border-radius:8px;padding:0.6rem 1rem;font-weight:600;cursor:pointer;font-size:0.8rem}
button:disabled{opacity:0.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:0.5rem}
.actions button{font-size:0.75rem;padding:0.5rem 0.75rem}
#help{position:fixed;inset:0;background:rgba(2,12,24,0.9);display:none;align-items:center;justify-content:center;z-index:20}
#help.show{display:flex}
.help-box{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:2rem;max-width:360px}
.help-box h2{color:var(--accent);margin-bottom:1rem;font-size:1rem}
.k{display:flex;justify-content:space-between;padding:0.4rem 0;font-size:0.85rem;border-bottom:1px solid rgba(255,255,255,0.05)}
kbd{background:rgba(0,212,255,0.15);padding:0.15rem 0.5rem;border-radius:4px;font-family:monospace}
@media(min-width:700px){#chat{grid-column:span 2}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:3px}
</style>
</head>
<body>
<header class="topbar"><h1>JARVIS</h1><div class="status"><span><span class="dot" id="d-mod"></span>Model</span><span><span class="dot" id="d-cpu"></span>CPU</span><span><span class="dot" id="d-mem"></span>Mem</span></div></header>
<main>
<section id="system" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/></svg>System</header><div class="content"></div><div class="error"></div></section>
<section id="model" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M16 14H8a4 4 0 0 0-4 4v2h16v-2a4 4 0 0 0-4-4z"/></svg>Model</header><div class="content"></div><div class="error"></div></section>
<section id="desktop" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/></svg>Desktop</header><div class="content"></div><div class="error"></div></section>
<section id="chat" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat</header><div class="content"><div class="chat-messages" id="msgs"><div class="msg j">System online.</div></div><div class="chat-input"><input id="cin" placeholder="Ask JARVIS..." onkeydown="if(event.key==='Enter')sendChat()"/><button onclick="sendChat()" id="cbtn">Send</button></div></div><div class="error"></div></section>
<section id="tasks" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</header><div class="content"></div><div class="error"></div></section>
<section id="memory" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Memory</header><div class="content"></div><div class="error"></div></section>
<section id="clipboard" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>Clipboard</header><div class="content"></div><div class="error"></div></section>
<section id="notifs" class="panel"><header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Notifications</header><div class="content"></div><div class="error"></div></section>
<section id="rss" class="panel"><header>RSS</header><div class="content"></div><div class="error"></div></section>
<section id="actions" class="panel"><header>Actions</header><div class="content actions"><button onclick="act('snapshot')">Snapshot</button><button onclick="act('organize_downloads')">Organize</button><button onclick="act('index_files')">Index</button><button onclick="act('archive_screenshots')">Archive</button><button onclick="act('health_report')">Health</button><button onclick="act('memory_consolidate')">Memory</button></div><div class="error"></div></section>
</main>
<div id="help"><div class="help-box"><h2>Shortcuts</h2><div class="k"><span>Focus chat</span><kbd>/</kbd></div><div class="k"><span>Help</span><kbd>?</kbd></div><div class="k"><span>Close</span><kbd>Esc</kbd></div><div style="margin-top:1rem;text-align:center"><button onclick="toggleHelp(false)">Close</button></div></div></div>
<script>
const $=id=>document.getElementById(id),API='http://127.0.0.1:5050/api';
const state={connected:false,panels:{}};
const panelMap={system:'/health',model:'/model',desktop:'/desktop',tasks:'/tasks',memory:'/memory',clipboard:'/clipboard',notifs:'/notifications',rss:'/rss'};
const panels=Object.keys(panelMap);
panels.forEach(p=>state.panels[p]={loading:true,error:null,data:null});
function setErr(id,msg){const el=$(id);el.classList.add('err');el.querySelector('.error').textContent=msg||'Error';state.panels[id].error=msg}
function clrErr(id){const el=$(id);el.classList.remove('err');el.querySelector('.error').textContent='';state.panels[id].error=null}
function setHtml(id,html){clrErr(id);$(id).querySelector('.content').innerHTML=html}
function bar(v){const cls=v>80?'hi':v>50?'md':'lo';return`<div class="rw"><span>${v}%</span></div><div class="bar"><div class="${cls}" style="width:${v}%"></div></div>`}
function pct(s){const m=String(s).match(/([\d.]+)/);return m?parseFloat(m[1]):0}
function memPct(s){const m=String(s).match(/([\d.]+)[A-Z]*\s*\/\s*([\d.]+)/);return m?Math.round((parseFloat(m[1])/parseFloat(m[2]))*100):0}
async function fetchData(path,retry=0){try{const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch(API+path,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}catch(e){if(retry<2)return fetchData(path,retry+1);throw e}}
function renderSystem(d){const cpu=pct(d?.cpu),mem=memPct(d?.memory),disk=memPct(d?.disk);$('d-cpu').className='dot '+(cpu>80?'err':cpu>50?'warn':'ok');$('d-mem').className='dot '+(mem>80?'err':mem>50?'warn':'ok');setHtml('system',`<div class="rw"><span>CPU ${d?.cpu||'—'}</span></div>${bar(cpu)}<div class="rw" style="margin-top:0.5rem"><span>Mem ${d?.memory||'—'}</span></div>${bar(mem)}<div class="rw" style="margin-top:0.5rem"><span>Disk ${d?.disk||'—'}</span></div>${bar(disk)}`)}
function renderModel(d){const s=d?.status||'unknown';$('d-mod').className='dot '+(s==='running'?'ok':s==='loading'?'warn':'err');setHtml('model',`<p>Model: <b>${d?.model||'—'}</b></p><p>Status: <b style="color:var(${s==='running'?'--green':s==='loading'?'--yellow':'--red'})">${s}</b></p>`)}
function renderDesktop(d){setHtml('desktop',`<p>Active: <b>${d?.active_window||'None'}</b></p><p>Class: <span style="color:var(--muted)">${d?.active_class||'—'}</span></p><p>Workspaces: <b>${d?.workspaces||0}</b></p>`)}
function renderTasks(d){const t=d?.items?.slice(0,8)||[];setHtml('tasks',t.length?t.map(x=>`<div class="it"><b>${x.priority||'L'}</b> ${x.title||x.name||'—'} <span style="color:var(--muted)">${x.status||''}</span></div>`).join(''):'<p style="color:var(--muted)">No tasks</p>')}
function renderList(id,d,key,slice=6){const items=(d?.[key]||[]).slice(0,slice);setHtml(id,items.length?items.map(i=>`<div class="it">${(i.content||i.text||i.title||i.message||'').substring(0,55)}</div>`).join(''):'<p style="color:var(--muted)">No items</p>')}
function renderAll(data){Object.entries(data).forEach(([k,v])=>state.panels[k].data=v);try{renderSystem(data.system||{})}catch(e){setErr('system',e.message)}try{renderModel(data.model||{})}catch(e){setErr('model',e.message)}try{renderDesktop(data.desktop||{})}catch(e){setErr('desktop',e.message)}try{renderTasks(data.tasks||{})}catch(e){setErr('tasks',e.message)}try{renderList('memory',data.memory||{},'entries')}catch(e){setErr('memory',e.message)}try{renderList('clipboard',data.clipboard||{},'recent')}catch(e){setErr('clipboard',e.message)}try{renderList('notifs',data.notifications||{},'recent')}catch(e){setErr('notifs',e.message)}try{renderList('rss',data.rss||{},'entries')}catch(e){setErr('rss',e.message)}}
async function loadAll(){const data={};await Promise.all(panels.map(async p=>{try{data[p]=await fetchData(panelMap[p])}catch(e){setErr(p,e.message)}}));renderAll(data)}
let es,recon=0;
function connect(){es=new EventSource(API+'/stream');es.onopen=()=>{state.connected=true;recon=0;loadAll()};es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='update')loadAll();if(d.health)renderSystem(d.health);if(d.model)renderModel(d.model);if(d.desktop)renderDesktop(d.desktop);if(d.tasks)renderTasks(d.tasks);if(d.memory)renderList('memory',d.memory,'entries');if(d.clipboard)renderList('clipboard',d.clipboard,'recent');if(d.notifications)renderList('notifs',d.notifications,'recent');if(d.rss)renderList('rss',d.rss,'entries');if(d.analytics)renderAnalytics(d.analytics)}catch(_){}};es.onerror=()=>{state.connected=false;es.close();recon++;setTimeout(connect,Math.min(30000,1000*Math.pow(2,recon)))}}
connect();
let chatInFlight=false,chatHist=[],streamBuf='',streamEl=null,rafId=null;
function pump(){if(!streamBuf.length||!streamEl){rafId=null;return}streamEl.textContent+=streamBuf[0];streamBuf=streamBuf.slice(1);rafId=requestAnimationFrame(pump)}
function addMsg(t,cls='j'){const m=$('msgs'),d=document.createElement('div');d.className='msg '+cls;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
async function sendChat(){if(chatInFlight)return;const i=$('cin'),t=i.value.trim();if(!t)return;chatInFlight=true;i.disabled=true;$('cbtn').disabled=true;addMsg(t,'u');streamEl=addMsg('','j');try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...chatHist,{role:'user',content:t}]})});if(!r.ok||!r.body)throw new Error('failed');const reader=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value);const lines=buf.split('\n');buf=lines.pop();for(const ln of lines){const m=ln.match(/^data:\s*(.*)$/);if(m){streamBuf+=m[1];if(!rafId)rafId=requestAnimationFrame(pump)}}}if(buf.length>0){const m=buf.match(/^data:\s*(.*)$/);if(m){streamBuf+=m[1];if(!rafId)rafId=requestAnimationFrame(pump)}}}catch(e){streamEl.textContent='Error: '+e.message}finally{chatInFlight=false;i.disabled=false;$('cbtn').disabled=false;i.focus();streamEl=null;streamBuf='';rafId=null}}
const debounce=new Map();
function act(a){if(debounce.get(a))return;debounce.set(a,true);fetch(API+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a})}).then(r=>r.ok?addMsg('Action '+a+' done.'):addMsg('Action '+a+' failed.')).catch(e=>addMsg('Action error: '+e.message)).finally(()=>setTimeout(()=>debounce.delete(a),500))}
function toggleHelp(v){$('help').classList.toggle('show',v)}
document.addEventListener('keydown',e=>{if(e.key==='?'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();toggleHelp(true)}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();$('cin').focus()}if(e.key==='Escape')toggleHelp(false)});
loadAll();
</script>
</body>
</html>
